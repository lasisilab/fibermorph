name: PR

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  title-format:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v3.4.0
        continue-on-error: true   # advisory in fork; lasisilab enforces this on the upstream PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}