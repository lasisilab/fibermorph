# Lasisi Lab design system (fibermorph GUI)
[theme]
base = "light"
primaryColor = "#05686D"             # teal-700 — functional / click colour
backgroundColor = "#FBFCFD"          # paper-2
secondaryBackgroundColor = "#F2F2F2" # paper-3
textColor = "#3F4251"                # ink-700 body; Open Sans loaded via CSS
font = "sans serif"

[server]
maxUploadSize = 500
enableXsrfProtection = true

[browser]
gatherUsageStats = false
